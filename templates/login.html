{% extends "base.html" %}
{% block title %}Log in to ResumeX{% endblock %}
{% block content %}
<div class="auth">
  <a class="wordmark" href="/">ResumeX</a>
  <h2>Log in</h2>
  <p class="muted">Pick up where you left off with your jobs and rankings.</p>
  {% if error %}<div class="alert bad">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="panel" style="margin-top:20px">
    <div class="field"><label for="email">Email</label>
      <input id="email" type="email" name="email" value="{{ email or '' }}" autocomplete="email" required autofocus></div>
    <div class="field"><label for="password">Password</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required></div>
    <button class="btn block">Log in</button>
  </form>
  <p class="small muted center" style="margin-top:18px">New to ResumeX? <a href="/register">Create an account</a></p>
</div>
{% endblock %}
